<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Management System</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f2f6ff;
        }

        header {
            background: #263b80;
            color: white;
            text-align: center;
            padding: 25px;
        }

        .container {
            width: 90%;
            max-width: 1000px;
            margin: 25px auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 0 10px #ccc;
        }

        h2 {
            color: #263b80;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border: 1px solid #bbb;
            border-radius: 6px;
        }

        button {
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            color: white;
            background: #263b80;
            cursor: pointer;
            margin-top: 10px;
        }

        button:hover {
            background: #17285f;
        }

        .delete-btn {
            background: #e53935;
            padding: 7px 12px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: center;
        }

        th {
            background: #263b80;
            color: white;
        }

        tr:nth-child(even) {
            background: #f5f5f5;
        }

        @media (max-width: 600px) {
            .container {
                width: 95%;
                padding: 15px;
            }

            table {
                font-size: 12px;
            }

            th, td {
                padding: 7px;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>Student Management System</h1>
        <p>Manage Student Details Easily</p>
    </header>

    <div class="container">

        <h2>Add Student Details</h2>

        <input type="text" id="studentName" placeholder="Enter student name">

        <input type="text" id="studentRoll" placeholder="Enter roll number">

        <input type="text" id="studentDepartment" placeholder="Enter department">

        <input type="number" id="studentMark" placeholder="Enter mark">

        <button onclick="addStudent()">Add Student</button>

        <h2>Student List</h2>

        <table>
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Roll Number</th>
                    <th>Department</th>
                    <th>Mark</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody id="studentTable">
            </tbody>
        </table>

    </div>

    <script>
        function addStudent() {
            let name = document.getElementById("studentName").value;
            let roll = document.getElementById("studentRoll").value;
            let department = document.getElementById("studentDepartment").value;
            let mark = document.getElementById("studentMark").value;

            if (name === "" || roll === "" || department === "" || mark === "") {
                alert("Please fill all details");
                return;
            }

            let table = document.getElementById("studentTable");

            let row = table.insertRow();

            row.insertCell(0).innerHTML = name;
            row.insertCell(1).innerHTML = roll;
            row.insertCell(2).innerHTML = department;
            row.insertCell(3).innerHTML = mark;

            row.insertCell(4).innerHTML =
                '<button class="delete-btn" onclick="deleteStudent(this)">Delete</button>';

            document.getElementById("studentName").value = "";
            document.getElementById("studentRoll").value = "";
            document.getElementById("studentDepartment").value = "";
            document.getElementById("studentMark").value = "";
        }

        function deleteStudent(button) {
            let row = button.parentNode.parentNode;
            row.remove();
        }
    </script>

</body>
</html>
